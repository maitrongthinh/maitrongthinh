name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild daily so the live GitHub stats stay current — they are baked in at
  # build time, not fetched in the browser.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; cancel a queued run rather than a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          # Lifts the anonymous GitHub API rate limit for the stats fetch.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Served from a custom domain (`thinh.2bd.net`, set as the Pages custom
          # domain and pinned by `public/CNAME`), which serves at the domain ROOT —
          # not under a repo sub-path. So there is no prefix: assets and routes live
          # at `/`. If the custom domain is ever removed and this falls back to the
          # project page `maitrongthinh.github.io/maitrongthinh`, set this back to
          # `/maitrongthinh` so the sub-path assets resolve again.
          BASE_PATH: ''
        run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # This repo previously served its README through the legacy Jekyll
          # builder, so Pages exists but with `build_type: branch` — under which
          # `configure-pages` answers `Get Pages site failed … Not Found` and the
          # deploy never runs. `enablement` makes the workflow flip the source to
          # Actions itself, so the live site does not depend on someone
          # remembering a checkbox in Settings → Pages.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
