name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild daily so the live GitHub stats stay current — they are baked in at
  # build time, not fetched in the browser.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; cancel a queued run rather than a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          # Lifts the anonymous GitHub API rate limit for the stats fetch.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # This repo is `maitrongthinh/maitrongthinh` — a repo whose name equals
          # the username, which GitHub treats as the profile repo, *not* as the
          # user site (that would be `maitrongthinh.github.io`). Pages therefore
          # serves it as a project page under a sub-path, so every asset and route
          # has to be prefixed. Leave empty only if this is ever moved to a repo
          # named `<username>.github.io`.
          BASE_PATH: '/maitrongthinh'
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
