name: Update Quote

# Rewrites the quote card between the QUOTE_CARD markers in README.md once a day.
# Kept from this repo's previous life as a profile-only repo; it now shares the
# repo with the portfolio site, which is why the two changes below matter:
#
#  * No `npm install`. `update-quote.js` requires nothing but `fs` and
#    `quotes.json`, and since the site landed here `npm install` would resolve the
#    entire Next.js tree on every run — slow, and a lockfile drift away from a
#    daily red X on a job that only rewrites one <img> tag.
#  * Node 20, not 14. Node 14 is past end-of-life and `actions/setup-node` no
#    longer ships it on every runner image.
on:
  workflow_dispatch: # Manually trigger the workflow
  schedule:
    - cron: '30 6 * * *' # 12:00 IST

# `contents: write` is required for the push below; the default token is
# read-only on repos created after early 2023.
permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update Quote
        run: node update-quote.js

      - name: Commit and push changes
        run: |
          git config user.name 'maitrongthinh'
          git config user.email 'maitrongthinh@users.noreply.github.com'
          # A repeated quote is a real outcome, not a failure: nothing to commit
          # means the random pick matched yesterday's.
          if git diff --quiet -- README.md; then
            echo "Quote unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "chore: update README with daily quote" -- README.md
          git push
