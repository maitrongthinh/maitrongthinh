<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" fill="#060607" />
  <!-- The monolith's tower state, reduced to three offset slabs so the mark still
       reads as a stack at 16px where a monogram would turn to mud. -->
  <rect x="7" y="6" width="16" height="4" fill="#f2f0eb" />
  <rect x="11" y="13" width="16" height="4" fill="#f2f0eb" />
  <rect x="5" y="20" width="16" height="4" fill="#f2f0eb" />
</svg>
